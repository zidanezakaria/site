<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modern Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Georgia,"Times New Roman",serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1c0a14,#4a1942 50%,#8b3a3a);
}

.container{
    width:400px;
    padding:35px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border:1px solid rgba(212,160,23,.35);
    box-shadow:0 20px 40px rgba(0,0,0,.45);
}

.container h1{
    color:white;
    text-align:center;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    color:white;
    margin-bottom:8px;
    font-size:14px;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:white;
    font-size:15px;
}

.password-box{
    position:relative;
}

.password-box button{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#d4a017;
    color:#1c0a14;
    font-size:16px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.login-btn:hover{
    background:#f0c14b;
}

.message{
    margin-top:20px;
    text-align:center;
    color:white;
    font-weight:bold;
}

.footer{
    margin-top:20px;
    text-align:center;
    color:white;
    font-size:14px;
}

.footer a{
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>Login</h1>

<form id="loginForm">

<div class="input-box">
<label>First Name</label>
<input
type="text"
id="firstname"
placeholder="Enter first name"
required>
</div>

<div class="input-box">
<label>Last Name</label>
<input
type="text"
id="lastname"
placeholder="Enter last name"
required>
</div>

<div class="input-box">
<label>Full Name</label>
<input
type="text"
id="name"
placeholder="Enter full name"
required>
</div>

<div class="input-box">
<label>Email</label>
<input
type="email"
id="email"
placeholder="Enter email"
required>
</div>

<div class="input-box">
<label>Phone Number</label>
<input
type="tel"
id="phone"
placeholder="Enter phone number"
required>
</div>

<div class="input-box password-box">
<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
required>

<button
type="button"
onclick="togglePassword()">
Show
</button>

</div>

<button class="login-btn">
Login
</button>

</form>

<div class="message" id="message"></div>

<div class="footer">
Don't have an account?
<a href="#">Register</a>
</div>

</div>

<script>

function togglePassword(){

const password=document.getElementById("password");
const button=event.target;

if(password.type==="password"){
    password.type="text";
    button.innerText="Hide";
}
else{
    password.type="password";
    button.innerText="Show";
}

}

document.getElementById("loginForm").addEventListener("submit",function(e){

e.preventDefault();

const firstname=document.getElementById("firstname").value.trim();
const lastname=document.getElementById("lastname").value.trim();
const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const phone=document.getElementById("phone").value.trim();
const password=document.getElementById("password").value.trim();

if(firstname===""||lastname===""||name===""||email===""||phone===""||password===""){
    document.getElementById("message").innerHTML="Please fill every field.";
    return;
}

const expected={
    firstname:"Donna",
    lastname:"Garcia",
    name:"Donna Garcia",
    phone:"+1-555-0538",
    email:"donna.garcia538@example.com",
    password:"DonnaGarcia0538!"
};

const matches=
    firstname===expected.firstname &&
    lastname===expected.lastname &&
    name===expected.name &&
    email===expected.email &&
    phone===expected.phone &&
    password===expected.password;

if(!matches){
    document.getElementById("message").innerHTML="Incorrect information. Access denied.";
    return;
}

sessionStorage.setItem("loggedInUser",JSON.stringify(expected));
window.location.href="welcome.html";

});

</script>

</body>
</html>
